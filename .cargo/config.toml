# Nothing is forced here any more, deliberately.
#
# This file used to set GDK_BACKEND=x11 and WEBKIT_DISABLE_DMABUF_RENDERER=1 for every `cargo run`,
# which made the dev build the only one that got the Fedora/NVIDIA rendering workarounds, and made
# them impossible to override from the shell: cargo's non-forced [env] sets a variable precisely
# when the environment does not have it, so `env -u WEBKIT_DISABLE_DMABUF_RENDERER cargo tauri dev`
# silently got it back. That trap cost a wrong diagnosis once already: the "native Wayland hangs
# with the DMABUF renderer on" row in 25da402 was really measured on XWayland, because this file
# was still forcing GDK_BACKEND=x11 when it was taken.
#
# Both variables now live in `src-tauri/src/lib.rs` `run()`, gated on the driver actually being
# NVIDIA, so dev, rpm and AppImage builds behave identically and anyone whose driver differs keeps
# GPU compositing. GDK_BACKEND is set nowhere: native Wayland is the only backend where the DMABUF
# renderer works on NVIDIA at all.
#
# To check which renderer a run actually used, read the app's own diagnostics (Settings ▸ About) or
# the startup log. Do NOT read /proc/<pid>/environ: it is the environment the process was *execed*
# with and is never updated, so nothing `std::env::set_var` does in `run()` ever shows up there,
# and WebKit's process launcher filters the web process's environment on top of that.
