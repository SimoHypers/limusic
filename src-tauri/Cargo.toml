[package]
name = "limusic-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Limusic — desktop YouTube Music client"
rust-version = "1.80"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "macos-private-api", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
# Phase 2 extraction stack (cipher + PoToken). context/04, 05, 13.
# BotGuard runs under deno_core + JSDOM, NOT in a hidden webview. Every token a real browser engine
# mints is rejected by googlevideo; a minimal-DOM runtime is the only one that produces an accepted
# one. Measured in `progress/active/webremix-stream-403.md`. This pulls in V8.
rustypipe-botguard = "0.1.2"
base64 = "0.22"
regex = "1"
urlencoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "stream"] }
# Loopback HTTP server for the music-video proxy (videoproxy.rs). Already in the tree behind
# reqwest, so this pins nothing new; WebKitGTK's media backend will only load http/https/blob.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

innertube = { path = "../crates/innertube" }
player = { path = "../crates/player" }
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
# Listen Together: shared wire types + WebSocket client (wss via rustls). context/19.
listen-protocol = { workspace = true }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = { workspace = true }
rand = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
discord-rich-presence = "1.1.0"
# Last.fm API signature (api_sig is md5 of the sorted params + secret), and the stable
# saved-account key (db.rs::account_key).
md-5 = "0.10"
lofty = "0.22.2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-clipboard-manager = "2.3.2"

# Taskbar thumbnail toolbar (#47). Same `windows` version tauri-runtime-wry already pulls in, so
# `Window::hwnd()` hands us a matching HWND.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.6"
libc = "0.2"
# Reaching the WebKitGTK settings wry leaves at browser defaults. Must track wry's version.
webkit2gtk = { version = "2.0", features = ["v2_40"] }
