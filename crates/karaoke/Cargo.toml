[package]
name = "karaoke"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
ort = "=2.0.0-rc.13"
symphonia = { version = "0.5", features = ["mp3", "flac", "wav", "aac", "ogg"] }
rubato = "0.14"
hound = "3.5"
realfft = "3.5"
flacenc = "0.4"

[features]
directml = ["ort/directml"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12"] }

[[example]]
name = "inspect"

[[example]]
name = "separate"

[[example]]
name = "devices"

[[example]]
name = "cache_test"
