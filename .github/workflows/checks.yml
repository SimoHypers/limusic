name: Checks

# Formatting only, on purpose.
#
# WHY THIS EXISTS: PR #13 ran `cargo fmt` against a repo that had no `rustfmt.toml`, so rustfmt's
# defaults reformatted 21 files the change never touched and buried ~900 lines of real work inside a
# 2400-line diff. The convention was written down only in a gitignored CLAUDE.md, so the contributor
# had no way to know. `rustfmt.toml` is committed now and the tree was normalised to it, which means
# the drift is detectable mechanically instead of during review.
#
# WHY NOT ALSO BUILD AND TEST HERE: `limusic-app` links libmpv and webkit2gtk, so testing it needs
# the full Tauri system-dependency install and a cold Rust compile. This job needs neither: rustfmt
# parses the source and never builds it, so it finishes in seconds on a bare runner and stays cheap
# enough to run on every push. The tests live in the `test` job below for exactly that reason.
# Note for anyone trimming that job: `crates/player` depends on libmpv2, so it is NOT free of the
# system setup. `-p innertube -p listen-protocol` is the subset that builds on a bare runner.

on:
  push:
    branches: [master, dev]
  pull_request:

# A second push to the same PR makes the earlier run irrelevant.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `components: rustfmt` rather than the default toolchain: nothing here compiles, so the rest
      # would only be download time.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # --all covers every workspace member, --check reports and exits non-zero instead of editing.
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: How to fix
        if: failure()
        run: |
          echo "::notice::Run 'cargo fmt --all' locally and commit the result."
          echo "rustfmt.toml at the repo root matches the existing style, so this should only"
          echo "touch code you actually changed. If it wants to reformat files you never opened,"
          echo "please open an issue instead of committing the churn."

  # The UI half of the gate. `svelte-check` is already a devDependency and `ui/package.json`
  # already defines the script, it simply had no caller. Cheap: no Rust, no system libraries.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 10 because `ui/package.json` has no `packageManager` field to pin it. If one is ever
      # added, this must match it or action-setup fails on the mismatch.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # Node 22 is what the maintainers run locally, and `--experimental-strip-types` (which the
      # self-checks below rely on) needs 22.6 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # --frozen-lockfile: a PR whose package.json and lockfile disagree fails here instead of
      # quietly resolving something nobody reviewed.
      - name: Install
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: svelte-check
        working-directory: ui
        run: pnpm check

      # The hand-written invariant checks in `ui/src/lib/*.check.ts` (queue order, drag and drop,
      # colour maths, link parsing and so on). `run-checks.mjs` finds them by glob, so a new one is
      # picked up without touching this file.
      - name: UI self-checks
        working-directory: ui
        run: pnpm test

  # The Rust half. `limusic-app` links libmpv and webkit2gtk, so this job pays for an apt install
  # and a cold compile that the rustfmt job deliberately avoids. That is why it is a separate job:
  # rustfmt still answers in seconds while this one runs.
  #
  # `cargo test --all` and not a pure-Rust subset: `crates/player` depends on libmpv2, so it
  # needs the same system libraries `limusic-app` does. The subset that builds bare is
  # `-p innertube -p listen-protocol`, which is not worth a second job.
  #
  # This is also the only place `macos_window_config_mirrors_the_base_window` runs. Nobody here
  # can build for macOS, so that test is the one guard on the macOS window config.
  test:
    # Pinned rather than ubuntu-latest, matching linux-release.yml, so a runner image bump cannot
    # change the system libraries under this gate without a visible diff.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # dtolnay installs the minimal profile, which has no clippy. Ask for it explicitly.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Caches ~/.cargo and target/ keyed on Cargo.lock, which is most of this job's cold time.
      - uses: Swatinem/rust-cache@v2

      # The build half of linux-release.yml's list. The gstreamer and jack packages there exist for
      # the AppImage bundle, and patchelf/file/mold for bundling and linking speed; none of them is
      # needed to compile and run the tests.
      - name: Build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libdbus-1-dev libmpv-dev

      # Offline only. The live YouTube smoke test and the lyrics API tests are #[ignore]d and stay
      # out of CI: they would fail on YouTube's schedule, not on the change under review.
      - name: cargo test --all
        run: cargo test --all

      # Reporting only for now: the tree has 13 pre-existing warnings, and turning them into errors
      # in the same change that introduces the gate would block every pull request on unrelated
      # cleanup. Flip to `-- -D warnings` once the backlog is cleared.
      - name: cargo clippy
        run: cargo clippy --all-targets
        continue-on-error: true

  # Windows: the platform where the release link differs from everything above (MSVC, a static VC
  # runtime via STATIC_VCRUNTIME, libmpv through a synthesised import library, the karaoke runtime
  # bundled next to the exe). Builds the app the way releases link it, runs the karaoke tests, and
  # holds the exe's import table to .github/windows-exe-imports.txt: a new load-time import is a DLL
  # every user needs just to start the app, which is how 1.2.0 shipped needing vulkan-1.dll (#436).
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Same pinned libmpv as windows-release.yml; keep the two in sync.
      MPV_DEV_URL: https://github.com/SimoHypers/limusic/releases/download/deps/libmpv-2-x86_64-20260610-git-304426c.7z
      MPV_DEV_SHA256: af708edcdf6ed12ac7b2bb31b4cbeba0bf7d4eef345a715ef5de782c0ddd6671
      MPV_DIR: ${{ github.workspace }}\.libmpv
      # What the tauri CLI exports for release builds (static VC runtime). A plain `cargo build`
      # would import vcruntime140*.dll and not match the allow-list.
      STATIC_VCRUNTIME: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # The app embeds ui/build (tauri.conf.json frontendDist), so it has to exist to compile.
      - name: Frontend build
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Rust (MSVC)
        shell: bash
        run: rustup default stable-msvc

      # Before rust-cache, for the same reason as in windows-release.yml: the cache key and cargo's
      # fingerprints both hash RUSTFLAGS.
      - name: RUSTFLAGS (libmpv link path)
        shell: bash
        run: echo "RUSTFLAGS=-L native=${{ github.workspace }}\.libmpv" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      # mpv.lib from libmpv-2.dll's export table, as in windows-release.yml (see the comments
      # there). The DLL also has to sit in src-tauri/: it is a bundle resource, and a missing
      # resource fails the build.
      - name: libmpv import library
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "$env:MPV_DIR" | Out-Null
          curl.exe -fsSL -o "$env:MPV_DIR\mpv-dev.7z" "$env:MPV_DEV_URL"
          if ((Get-FileHash "$env:MPV_DIR\mpv-dev.7z" -Algorithm SHA256).Hash -ne $env:MPV_DEV_SHA256) { throw "mpv-dev.7z does not match MPV_DEV_SHA256" }
          7z x "$env:MPV_DIR\mpv-dev.7z" -o"$env:MPV_DIR" -y | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          Set-Location "$env:MPV_DIR"
          $names = & dumpbin /exports libmpv-2.dll |
            Select-String -Pattern '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\w+)' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          if ($names.Count -lt 50) { throw "parsed only $($names.Count) exports from libmpv-2.dll" }
          @("EXPORTS") + ($names | ForEach-Object { "    $_" }) | Set-Content -Path mpv.def -Encoding ascii
          & lib /def:mpv.def /name:libmpv-2.dll /out:mpv.lib /machine:x64
          if (-not (Test-Path "$env:MPV_DIR\mpv.lib")) { throw "lib.exe did not produce mpv.lib" }
          Copy-Item "$env:MPV_DIR\libmpv-2.dll" "$env:GITHUB_WORKSPACE\src-tauri\libmpv-2.dll" -Force

      - name: Karaoke runtime
        shell: pwsh
        run: ./scripts/fetch-karaoke-runtime.ps1

      - name: cargo build -p limusic-app
        run: cargo build -p limusic-app

      - name: cargo test -p karaoke
        run: cargo test -p karaoke

      - name: Import table check
        shell: pwsh
        run: ./scripts/check-windows-imports.ps1 -Exe target/debug/limusic-app.exe
