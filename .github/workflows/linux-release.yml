name: Linux release binaries

# Builds and signs the Linux AppImage for a release that ALREADY EXISTS, attaches it, adds the
# `linux-x86_64` entry to latest.json, and finally marks the release "Latest".
#
# WHY THIS EXISTS: an AppImage bundles the *build host's* system libraries but cannot bundle glibc,
# so it inherits the build host's glibc floor. Built on Fedora (glibc 2.43) the 0.2.9 AppImage
# refused to start anywhere else — 78 of its 368 bundled libs demanded GLIBC_2.43, which only
# Fedora 44 / Arch / rawhide have. Building here on a pinned, deliberately older runner puts the
# floor at glibc 2.39: Ubuntu 24.04+, Debian 13+, Fedora 40+, current Arch.
#
# `runs-on` is PINNED ON PURPOSE. Never change it to `ubuntu-latest` — that tracks the newest
# Ubuntu and would silently reintroduce exactly the bug this workflow exists to fix. The
# "Check the glibc floor" step below fails the build if someone does it anyway.
#
# scripts/release.sh (run on Fedora) still builds and publishes the .rpm — an rpm links against the
# host's system libs, so Fedora is the correct place to build it.
#
# It can also be run by hand against an older tag to backfill:
#   Actions ▸ Linux release binaries ▸ Run workflow ▸ tag = v0.2.9
#
# Requires repo secrets (same set as the Windows workflow):
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD   (mandatory — no sig, no update)
#   LASTFM_API_KEY / LASTFM_API_SECRET                               (optional — warn-only)

# DISPATCH ONLY, ON PURPOSE — do not add `release: published` back. Actions caches are ref-scoped:
# a run can read caches from its own ref and from the default branch, nothing else. A run triggered
# by a release executes on the *tag* ref, so every such build wrote a cache no later run could ever
# read and then recompiled from scratch. Windows was paying 11m25s of cold Rust compile on every
# single release because of it. A dispatched run executes on master, so the cache is shared, while
# the checkout below still pins the build to the tag. scripts/release.sh dispatches both workflows.
# Consequence: publishing a release from the GitHub UI builds nothing. Use the script.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build the Linux AppImage for (e.g. v0.2.9)
        required: true
        type: string
      dry_run:
        description: Build and run every check, but attach nothing to the release
        required: false
        default: false
        type: boolean

permissions:
  contents: write # upload assets onto the release

# Per-workflow, NOT shared with windows-release.yml any more: the two now run in parallel, and the
# only thing they contend for is latest.json, which the upload step merges with a read-back retry.
concurrency:
  group: linux-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - name: Resolve the tag
        id: rel
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || { echo "::error::no tag to build for"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.rel.outputs.tag }}

      # The tag is the contract: the binaries must be built from the source that tag points at, and
      # the updater compares tauri.conf.json's version. If they disagree, the version bump never got
      # committed — stop before shipping a mislabelled AppImage.
      - name: Check the tag matches the app version
        run: |
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "v$VERSION" != "${{ steps.rel.outputs.tag }}" ]; then
            echo "::error::tauri.conf.json says $VERSION but the tag is ${{ steps.rel.outputs.tag }} — was the version bump committed before the tag was cut?"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Bake a snapshot of the community player-cipher registry into src-tauri/cipher_configs.json,
      # which is `include_str!`d into the binary. Nothing needing a deciphered stream URL plays
      # without a config for the current player.js, and the tracked file is deliberately empty —
      # the table is refreshed from these same registries at runtime.
      #
      # So this only covers the case where that refresh can't happen: a first run on a network that
      # blocks raw.githubusercontent.com. Without a snapshot that user has no cipher at all and
      # every restricted track is skipped. It goes stale within days either way, which is fine; the
      # runtime refresh is what keeps it current.
      #
      # NEVER FATAL. These registries are third-party. A release must not fail because one is down,
      # and shipping the empty table is exactly the behaviour we had before this step existed.
      - name: Bake in the player-cipher registry
        shell: bash
        run: |
          FARADAY=https://raw.githubusercontent.com/MetrolistGroup/faraday/master/registry/player_configs.json
          ZEMER=https://raw.githubusercontent.com/ZemerTeam/zemer-cipher/master/library/src/main/assets/player_configs.json
          tmp="$(mktemp)"
          for url in "$FARADAY" "$ZEMER"; do
            # Validate before overwriting: a 404 body or a half-written file must not replace a
            # good table with something the app will silently parse as empty.
            if curl -fsSL --max-time 30 "$url" -o "$tmp" \
               && jq -e '(.players | objects | length) > 0' "$tmp" >/dev/null 2>&1; then
              cp "$tmp" src-tauri/cipher_configs.json
              echo "bundled $(jq '.players | length' "$tmp") player configs from $url"
              exit 0
            fi
            echo "::warning::player-cipher registry unusable: $url"
          done
          echo "::warning::no player-cipher registry reachable — shipping the empty table; clients will fetch it at runtime"

      # webkit2gtk-4.1 + gtk3 + appindicator are Tauri's; libmpv-dev is ours (libmpv2-sys ships
      # pregenerated bindings and just emits `-lmpv`, so only the link-time lib is needed);
      # libdbus-1-dev comes from tao, libssl-dev from reqwest's native-tls path.
      - name: Build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libdbus-1-dev libmpv-dev patchelf file \
            libjack-jackd2-0 glib-networking \
            clang clang++ mold
          # libjack: linuxdeploy excludes it, so fix-appdir-tls.sh copies it in by hand.
          # glib-networking: supplies the gio TLS module that gets bundled. Without it the webview
          # has no TLS backend at all, which is the bug that started this whole saga.

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend deps
        run: |
          npm install -g pnpm@10
          cd ui && pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Tauri CLI
        # The npm CLI ships a prebuilt binary — `cargo install tauri-cli` would compile it from
        # source on every cache miss (~5 min for nothing).
        run: npm install -g "@tauri-apps/cli@^2"

      # The gitignored src-tauri/lastfm.keys (read by build.rs) obviously isn't in the checkout —
      # recreate it from repo secrets. Missing secrets are a warning, not a failure: the app is
      # fully functional without Last.fm.
      - name: Last.fm API keys
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          if [ -n "$LASTFM_API_KEY" ] && [ -n "$LASTFM_API_SECRET" ]; then
            printf 'LIMUSIC_LASTFM_API_KEY=%s\nLIMUSIC_LASTFM_API_SECRET=%s\n' \
              "$LASTFM_API_KEY" "$LASTFM_API_SECRET" > src-tauri/lastfm.keys
            echo "lastfm.keys written"
          else
            echo "::warning::LASTFM_API_KEY / LASTFM_API_SECRET secrets not set — this Linux build ships without Last.fm scrobbling"
          fi

      - name: Build + sign the AppImage
        env:
          # Scoped to this step only — no other step (or third-party action) sees the signing key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
   
          # linuxdeploy bundles an ancient `strip` that chokes on modern ELF sections (DT_RELR).
          NO_STRIP: "true"
          # The bundler runs linuxdeploy/appimagetool, themselves AppImages — the runner has no
          # FUSE, so make them self-extract instead.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set — the build would produce an unsignable AppImage"
            exit 1
          fi
          (cd ui && pnpm build)
          # beforeBuildCommand is emptied because we just ran it, deterministically. Left on, tauri
          # runs `pnpm build` from the repo root — which has no package.json, so which of the two
          # frontend packages (ui/, website/) pnpm picks is up to the filesystem: Windows resolved
          # it to ui, Linux to website, whose deps this job never installs. It only works locally
          # because you run it from ui/.
          tauri build --bundles appimage --config '{"build":{"beforeBuildCommand":""}}'
          # Strip the bundled TLS trust stack + gio modules out of the AppDir and repack: they are
          # coupled to the build host's config and leave the webview with no TLS backend anywhere
          # else. Repacking invalidates the bundler's signature, so the script re-signs — which is
          # why it runs inside this step, where the key is in scope.
          scripts/fix-appdir-tls.sh

      # v0.2.11 shipped an AppImage that couldn't start on a host without JACK, because libmpv
      # DT_NEEDs libjack.so.0 and linuxdeploy excludes it. Everything the bundle links must either be
      # inside the AppDir or be a library any Linux desktop is guaranteed to have. The allowlist
      # below is the calibrated set for this app; if a new name shows up, decide deliberately
      # whether to bundle it or add it here — don't widen it to make a build pass.
      - name: Check nothing is missing from the bundle
        run: |
          set -euo pipefail
          APPDIR=target/release/bundle/appimage/limusic.AppDir
          HOST_BASELINE="ld-linux-x86-64.so.2 libc.so.6 libm.so.6 libresolv.so.2 libgcc_s.so.1
            libstdc++.so.6 libGL.so.1 libEGL.so.1 libGLX.so.0 libGLdispatch.so.0 libOpenGL.so.0
            libdrm.so.2 libgbm.so.1 libwayland-client.so.0 libX11.so.6
            libX11-xcb.so.1 libxcb.so.1 libxcb-dri3.so.0 libexpat.so.1 libfontconfig.so.1
            libfreetype.so.6 libharfbuzz.so.0 libfribidi.so.0 libz.so.1 libasound.so.2
            libusb-1.0.so.0 libcom_err.so.2 libgpg-error.so.0"
          for f in "$APPDIR"/usr/lib/*.so* "$APPDIR"/usr/lib64/*.so* "$APPDIR"/usr/bin/*; do
            [ -e "$f" ] || continue
            objdump -p "$f" 2>/dev/null | awk '/NEEDED/{print $2}'
          done | sort -u > /tmp/needed.txt
          # `find`, not `ls dirA dirB`: ls exits nonzero if either path is missing, and an Ubuntu
          # AppDir has no usr/lib64 — under pipefail that fails the step for no reason.
          find "$APPDIR/usr/lib" "$APPDIR/usr/lib64" -maxdepth 1 -printf '%f\n' 2>/dev/null \
            | sort -u > /tmp/have.txt || true
          MISSING=""
          while read -r lib; do
            [ -n "$lib" ] || continue
            grep -qx "$lib" /tmp/have.txt && continue
            echo "$HOST_BASELINE" | tr -s ' \n' '\n' | grep -qx "$lib" && continue
            MISSING="$MISSING $lib"
          done < /tmp/needed.txt
          if [ -n "$MISSING" ]; then
            echo "::error::bundle links libraries it neither ships nor can assume:$MISSING"
            echo "Bundle them in scripts/fix-appdir-tls.sh, or add them to HOST_BASELINE if every distro really has them."
            exit 1
          fi
          echo "every DT_NEEDED is either bundled or a host baseline library"

      # The static guards above only see this runner. Every failure in this family (v0.2.10's
      # undefined symbol, v0.2.11's missing libnettle.so.8 on Arch, v0.2.14's dead webviews on
      # Mesa) looked fine on Ubuntu and only appeared on someone else's distro. So run the app on
      # two of them: Debian sid for the newest GLib and Mesa, Arch because its sonames differ from
      # everyone else's. The script resolves every symbol, checks that the AppDir doesn't break the
      # host libraries the app dlopens, and then actually starts the thing under Xvfb — v0.2.14
      # passed both static checks and still could not open a single webview.
      - name: Verify it loads and runs on foreign distros
        run: |
          set -euo pipefail
          APPDIR="$PWD/target/release/bundle/appimage/limusic.AppDir"
          for image in debian:sid archlinux:latest; do
            echo "── $image"
            docker run --rm -v "$APPDIR:/app:ro" \
              -v "$PWD/scripts/appdir-foreign-check.sh:/check.sh:ro" "$image" bash /check.sh
          done

      # The regression test for this whole workflow. Nothing bundled may need a newer glibc than the
      # runner's own, or the AppImage only runs on distros at least as new as the build host — the
      # 0.2.9 failure. Runs against the AppDir the bundler just assembled.
      - name: Check the glibc floor
        run: |
          set -euo pipefail
          FLOOR=2.39   # keep in sync with `runs-on` above
          APPDIR=target/release/bundle/appimage/limusic.AppDir
          [ -d "$APPDIR" ] || { echo "::error::no AppDir at $APPDIR — did the bundler change its layout?"; exit 1; }
          # `|| true`: objdump exits nonzero on the non-ELF files that live under usr/lib (module
          # caches, pkgconfig, …), which under pipefail would fail the step for no reason.
          WORST="$(find "$APPDIR/usr/lib" "$APPDIR/usr/bin" -type f -exec objdump -T {} + 2>/dev/null \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1 || true)"
          echo "highest glibc symbol required by the bundle: ${WORST:-none}"
          if [ "$(printf '%s\nGLIBC_%s\n' "$WORST" "$FLOOR" | sort -V | tail -1)" != "GLIBC_$FLOOR" ]; then
            echo "::error::bundle requires $WORST but the floor is GLIBC_$FLOOR — is runs-on still pinned to an old runner?"
            find "$APPDIR/usr/lib" -type f -exec sh -c 'objdump -T "$1" 2>/dev/null | grep -q "$2" && echo "  $1"' _ {} "$WORST" \; || true
            exit 1
          fi

      - name: Dry run — built and verified, attaching nothing
        if: ${{ inputs.dry_run }}
        run: echo "dry_run - every build step and guard passed; release assets left untouched."

      - name: Attach the AppImage + teach latest.json about Linux
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.rel.outputs.tag }}"
          APPIMAGE="$(ls target/release/bundle/appimage/limusic_${VERSION}_*.AppImage 2>/dev/null | head -1 || true)"
          SIG="$APPIMAGE.sig"

          if [ -z "$APPIMAGE" ] || [ ! -f "$APPIMAGE" ]; then
            echo "::error::no AppImage for $VERSION"; find target/release/bundle -maxdepth 2; exit 1
          fi
          if [ ! -f "$SIG" ]; then
            echo "::error::no .sig next to the AppImage — signing key missing, or createUpdaterArtifacts got turned off"; exit 1
          fi

          gh release upload "$TAG" "$APPIMAGE" "$SIG" --clobber --repo "$GITHUB_REPOSITORY"

          # latest.json is the one thing both release workflows write, and they now run in parallel.
          # There is no compare-and-swap on release assets, so: merge, upload, read back, and retry
          # if the other job clobbered us in between. Whoever loses a round re-merges onto the
          # winner's copy, so it converges — normally on the first attempt, worst case the second.
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$APPIMAGE")"
          for attempt in 1 2 3 4 5; do
            rm -rf manifest && gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir manifest
            MANIFEST_VERSION="$(jq -r .version manifest/latest.json)"
            if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
              echo "::error::the release's latest.json is for $MANIFEST_VERSION but we built $VERSION"; exit 1
            fi
            jq --arg sig "$(cat "$SIG")" --arg url "$URL" \
              '.platforms["linux-x86_64"] = { signature: $sig, url: $url }' \
              manifest/latest.json > latest.json
            gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"

            sleep $((3 + RANDOM % 5))
            rm -rf check && gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir check
            if [ "$(jq -r '.platforms["linux-x86_64"].url // ""' check/latest.json)" = "$URL" ]; then
              echo "latest.json carries linux-x86_64 (attempt $attempt): $(jq -c '.platforms | keys' check/latest.json)"
              break
            fi
            [ "$attempt" -lt 5 ] || { echo "::error::linux-x86_64 kept getting clobbered out of latest.json"; exit 1; }
            echo "the Windows job clobbered the manifest, re-merging"
          done

          # Only now is the release fit to be "Latest". The updater resolves through
          # /releases/latest/download/latest.json, so flipping this last means users keep seeing the
          # previous (complete) manifest while this one is still half-built, instead of a manifest
          # with no Linux entry.
          gh release edit "$TAG" --latest --repo "$GITHUB_REPOSITORY"

          echo "Published. latest.json now covers: $(jq -c '.platforms | keys' latest.json)"
